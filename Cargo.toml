[workspace]
resolver = "2"
members = [
    "shell-core",
    "shell-init",
    "shell-signal",
    "shell-session",
    "utils",
    "config",
    "parser",
    "lexer",
    "executor",
    "prompt",
    "history",
    "completion",
    "highlight",
    "plugin",
    "builtins",
    "theme",
    "editor",
    "aster",
    "tests",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
authors = ["AsterShell Contributors"]
description = "A modern, fast, lightweight, extensible Linux shell"
license = "MIT"
repository = "https://github.com/aster-shell/AsterShell"
homepage = "https://github.com/aster-shell/AsterShell"
documentation = "https://docs.rs/aster-shell"
readme = "README.md"
keywords = ["shell", "linux", "terminal", "cli"]
categories = ["command-line-utilities"]
exclude = [".github/", "docs/", "scripts/"]

[workspace.dependencies]
# Internal crates
aster-shell-core = { path = "shell-core", version = "0.4.0" }
aster-shell-init = { path = "shell-init", version = "0.4.0" }
aster-shell-signal = { path = "shell-signal", version = "0.4.0" }
aster-shell-session = { path = "shell-session", version = "0.4.0" }
aster-utils = { path = "utils", version = "0.4.0" }
aster-config = { path = "config", version = "0.4.0" }
aster-parser = { path = "parser", version = "0.4.0" }
aster-lexer = { path = "lexer", version = "0.4.0" }
aster-executor = { path = "executor", version = "0.4.0" }
aster-prompt = { path = "prompt", version = "0.4.0" }
aster-history = { path = "history", version = "0.4.0" }
aster-completion = { path = "completion", version = "0.4.0" }
aster-highlight = { path = "highlight", version = "0.4.0" }
aster-plugin = { path = "plugin", version = "0.4.0" }
aster-builtins = { path = "builtins", version = "0.4.0" }
aster-theme = { path = "theme", version = "0.4.0" }
aster-editor = { path = "editor", version = "0.4.0" }

# External dependencies
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-log = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "6"
libc = "0.2"
log = "0.4"
tempfile = "3"
rustyline = "18"
nu-ansi-term = "0.50"
unicode-width = "0.2"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
glob = "0.3"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unused_imports = "warn"
unused_variables = "warn"
dead_code = "warn"
trivial_numeric_casts = "warn"
unused_extern_crates = "warn"
unused_must_use = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
rust_2021_compatibility = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
module_name_repetitions = "warn"
must_use_candidate = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
doc_markdown = "warn"
tabs_in_doc_comments = "warn"
unused_self = "warn"
if_not_else = "warn"
redundant_else = "warn"
match_same_arms = "warn"
needless_pass_by_value = "warn"
items_after_statements = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
impl_trait_in_params = "warn"
enum_glob_use = "warn"
map_unwrap_or = "warn"
range_minus_one = "warn"
range_plus_one = "warn"
wildcard_imports = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false

[profile.dev]
opt-level = 0
debug = true
incremental = true
debug-assertions = true
overflow-checks = true

[profile.dev.package."*"]
opt-level = 2

[profile.bench]
inherits = "release"
lto = "thin"
codegen-units = 4

[profile.test]
inherits = "dev"
debug-assertions = true
overflow-checks = true
